[project]
name = "elderleaf"
version = "0.1.0"
description = "ElderLeaf backend: SAM 3.1 segmentation, metrics and agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.7",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "scipy>=1.17.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elderleaf"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
